# Builds the game into a .pbg on every push, and attaches it to a release
# for every tag pushed. The game's folder is mygame; rename it and change
# CART below to match.

name: Build

on:
  push:
  workflow_dispatch:

env:
  CART: mygame

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A game made from the template has the template's id, all noughts:
      # saves and scores are kept under it, so each game is given its own
      # the first time it is built, and that is committed back.
      - name: Give the game its own id
        run: |
          if grep -q '"id": *"0000000000000000"' "$CART/cart.json"; then
            id=$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')
            sed -i "s/\"id\": *\"0000000000000000\"/\"id\": \"$id\"/" "$CART/cart.json"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Give the game its own id"
            git push
          fi

      - uses: anthonyfletcher/podbox-arcade-builder@latest
        id: cart
        with:
          cart: ${{ env.CART }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CART }}
          path: ${{ steps.cart.outputs.pbg }}

      - name: Attach it to a release, for a tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.cart.outputs.pbg }}" --generate-notes
