# Builds the library fetch tools (tools/fetch/) for Windows and macOS and
# publishes them as the `Tools` release. PyInstaller builds only for the
# system it runs on, so each platform has a runner of its own.
#
# release.sh starts this once `latest` is published, on that tag, with
# publish on; run by hand from the Actions tab, it only builds unless
# publish is ticked.
name: Fetch tools

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Replace the Tools release with this build
        type: boolean
        default: false

permissions:
  contents: write

# Two runs at once would race to delete and create the release
concurrency:
  group: fetch-tools

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r tools/fetch/requirements.txt pyinstaller==6.22.3
      - name: Build
        shell: bash
        run: |
          cd tools/fetch
          python -m PyInstaller --onefile --console --clean --name fetch_pb fetch_pb.py
      - name: Check
        shell: bash
        run: |
          cd tools/fetch/dist
          for command in art lyrics notes; do
            ./fetch_pb "$command" --help > /dev/null
          done
      - name: Pack
        shell: bash
        run: |
          mkdir -p out/podbox-tools
          cp tools/fetch/dist/* out/podbox-tools/
          cp tools/fetch/README.md tools/fetch/art_fetch.md tools/fetch/lyric_fetch.md tools/fetch/notes_fetch.md out/podbox-tools/
          python tools/fetch/licenses.py out/podbox-tools/LICENSES.txt
          cd out
          if [ "${{ matrix.name }}" = windows ]; then
            7z a -tzip "podbox-tools-${{ matrix.name }}.zip" podbox-tools > /dev/null
          else
            # ditto keeps the executable bit, which plain zip tools may drop
            ditto -c -k --keepParent podbox-tools "podbox-tools-${{ matrix.name }}.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: podbox-tools-${{ matrix.name }}
          path: out/podbox-tools-${{ matrix.name }}.zip

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Replace the Tools release
        run: |
          cat > notes.md <<EOF
          Desktop tools that fill a library with what the player shows but cannot fetch, built from ${GITHUB_SHA::10}.

          One program, \`fetch_pb\`, with three commands:

          - **art** -- pictures of artists and authors, and covers for albums, audiobooks, podcasts and ebooks.
          - **lyrics** -- synchronised lyrics from LRCLIB, as \`.lrc\` files beside the tracks.
          - **notes** -- liner notes and biographies from Wikipedia and MusicBrainz, as pages for the player's Liner Notes.

          Unzip the one for your computer and run it from a terminal in that folder: \`.\\fetch_pb lyrics E:\\\` on Windows, \`./fetch_pb lyrics /Volumes/IPOD\` on a Mac. \`fetch_pb COMMAND --help\` lists a command's options, and the READMEs inside say more.

          On a Mac the program is not signed, so macOS refuses it the first time. In Terminal, in the unzipped folder, run \`xattr -dr com.apple.quarantine .\` once.
          EOF
          gh release delete Tools --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh api --method DELETE --silent "repos/$GITHUB_REPOSITORY/git/refs/tags/Tools" 2>/dev/null || true
          gh release create Tools --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title Tools --notes-file notes.md --latest=false assets/*.zip
