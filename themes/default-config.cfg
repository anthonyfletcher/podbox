# First-boot config, copied to /.rockbox/config.cfg by bundle-theme.sh.
#
# This is now only "which theme a fresh install starts on" -- everything that
# was tuning for this hardware has moved into the compiled defaults in
# settings_list.c, where a Reset Settings reaches it too.
#
# The theme lines are the same ones Themify_2.cfg carries, and the duplication
# is deliberate: one file says what the theme is, this one says that the player
# starts wearing it.
#
# The quickscreen slots are the exception that is not a theme setting. They are
# CUSTOM_SETTINGs holding a pointer to another setting, which cannot be written
# as a compile-time default, so they are set here instead.

wps: Themify_2
sbs: Themify_2
font: 22-LeagueSpartan-Regular
font bold: 22-LeagueSpartan-Bold
backdrop: -

show icons: on
scrollbar: right
foreground color: fff2f9
background color: 031835

scroll speed: 14
scroll delay: 1500
scroll step: 1

dynamic colors: on
dialog button border radius: 4

album covers statusbar: on
album covers background: foreground
album covers center margin: 20

database album art: on
database artist art: on
database art row height: 46

qs top: brightness
qs bottom: brightness
