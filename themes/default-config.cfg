# First-boot config, shipped as /.rockbox/default-config.cfg and read only
# when the player has no config.cfg of its own -- so it decides what a new
# player starts with and can never change a setting on an existing one.

theme: scrim

wps: scrim
sbs: scrim

font: /.rockbox/fonts/18-noto-sans.fnt
font bold: /.rockbox/fonts/18-noto-sans-bold.fnt
backdrop: -

show icons: on
foreground color: ffffff
background color: 000000

scroll speed: 14
scroll delay: 1500
scroll step: 1

album covers statusbar: on
dialog button border radius: 0
dialog box margin: 15

album covers center margin: 20

statusbar: off
scrollbar: off
dynamic colors: on

database album art: on
database artist art: on
playlist viewer indices: off

qs top: brightness
qs bottom: brightness
