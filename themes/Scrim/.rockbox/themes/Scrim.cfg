# Scrim
wps: Scrim
sbs: Scrim
font: /.rockbox/fonts/18-noto-sans.fnt
font bold: /.rockbox/fonts/18-noto-sans-bold.fnt
backdrop: -
foreground color: ffffff
background color: 000000
statusbar: off
scrollbar: off
dynamic colors: on
# Album, not auto, because the dynamic palette depends on it: palette_from_cache()
# gives up unless this is album, so on auto the colours come from the buffered
# art in the audio buffer instead -- read unpinned, refilled per track, and so
# not always the same picture twice for one album.
wps art source: album
show icons: on
database album art: on
database artist art: on
database art row height: 46
playlist viewer indices: off
